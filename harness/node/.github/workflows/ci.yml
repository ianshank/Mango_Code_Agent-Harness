# NOTE: This workflow is a reference adoption template -- it is never executed by
# GitHub Actions. GitHub only discovers and runs workflows under the repository's
# ROOT .github/workflows/ (see .github/workflows/python-package.yml for the real,
# live CI). The gitleaks/osv-scanner steps below are not live enforcement; treat
# this file as a starting point for adopters standing up this stack independently,
# not as evidence that any of these gates run against this repository.
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version-file: .nvmrc }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: make remotes
      - run: make projections
      - run: make traceability
      - run: make governance
      # This job is authoritative evidence of repository conformance.
      # Network/write authority belongs to the external tool broker/PDP.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version-file: .nvmrc }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: bash scripts/install_hooks.sh
      - run: make cov
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version-file: .nvmrc }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: make lint
      - run: make types
      - run: REQUIRE_STRICT_SPEC_VALIDATOR=1 make specs
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: Install pinned scanners
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.2.3
      - run: PATH="$(go env GOPATH)/bin:$PATH" make secrets
      - run: PATH="$(go env GOPATH)/bin:$PATH" make audit
