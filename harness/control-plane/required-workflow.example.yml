# Install this workflow in an organization-owned governance repository/ruleset.
# The verifier and policy bundle below are checked out from that protected repo,
# not imported from the governed project.
name: agentic-ssd-required-governance
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify-protected-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governed repository
        uses: actions/checkout@PIN_FULL_COMMIT_SHA
        with:
          path: project
          fetch-depth: 0
      - name: Checkout independently protected governance control plane
        uses: actions/checkout@PIN_FULL_COMMIT_SHA
        with:
          repository: REPLACE_ORG/REPLACE_GOVERNANCE_REPO
          ref: PIN_GOVERNANCE_CONTROL_COMMIT_SHA
          path: governance-control
      - name: Verify protected governance digests
        run: |
          python3 governance-control/verify_repository.py \
            --repo project \
            --bundle governance-control/policy-bundle.json
      - name: Run project conformance gate after protected verification
        working-directory: project
        run: make governance
