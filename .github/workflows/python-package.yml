# Mango Code Agent Harness — unified CI pipeline.
# Runs the repo's own `make ci` gate (lint -> coverage -> test-node -> zero-skips
# -> validate -> drift-check) instead of a generic template.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    # `labeled` is load-bearing, not noise: ALLOW_GITHUB_CHANGES is derived from
    # the `infra-reviewed` label below, and the default types
    # [opened, synchronize, reopened] do not include it. Without this, applying
    # the label cannot re-run CI -- "Re-run all jobs" replays the original,
    # unlabelled event payload -- so a protected-path PR could only be unblocked
    # by pushing another commit or closing and reopening it.
    types: [opened, synchronize, reopened, labeled]
    # Stacked/phase branches must also be gated, otherwise a PR targeting an
    # integration branch merges without ever running `make ci`. `claude/**` is
    # the agent branch namespace and was missing here: a PR stacked onto one got
    # zero check runs, which is the exact hole this list exists to close.
    branches: ["main", "chore/**", "claude/**", "phase*/**", "feature/**"]

permissions:
  contents: read

jobs:
  # The Node suite's outcome is Python-version-independent, so the full gate
  # (make ci, including test-node + verify-zero-skips) runs on one primary leg
  # and the remaining interpreters run the Python-scoped `make ci-python`.
  # Previously every matrix leg installed pnpm/node_modules and ran the entire
  # Vitest suite — four identical Node runs per PR for one signal.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject ruff target-version is py39 (oldest supported).
        # check_py_compat gate enforces no runtime-only 3.10+ constructs.
        python-version: ["3.9", "3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run Python CI gate (make ci-python)
        # The protected-path invariant fails closed on infrastructure changes
        # (Makefile, .github/**, .mango/agents/**, governance policy). A human
        # applying the `infra-reviewed` label IS the per-change review
        # attestation required by harness/CONTRACT.md; without the label the
        # gate stays fail-closed. Never set this unconditionally.
        env:
          ALLOW_GITHUB_CHANGES: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'infra-reviewed') && '1' || '' }}
        run: make ci-python

  build-full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Primary leg: one modern interpreter runs the complete gate,
          # including the Node stack. The compat gate plus the ci-python matrix
          # covers the older interpreters.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      # pnpm must be on PATH *before* actions/setup-node runs, because
      # `cache: pnpm` resolves the pnpm store via the pnpm binary. Installing it
      # afterwards fails the "Set up Node" step with "Unable to locate
      # executable file: pnpm".
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # Read the pinned version from `packageManager` in the Node package
          # manifest (single source of truth) rather than duplicating it here.
          package_json_file: harness/node/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 (pinned via packageManager) requires Node >= 22.13.
          # Node 20 is also being deprecated on GitHub-hosted runners.
          node-version: 22
          cache: pnpm
          cache-dependency-path: harness/node/pnpm-lock.yaml

      # Routed through `make node-deps` rather than an inline pnpm call so CI,
      # the session-start hook and a local run all execute the same recipe.
      # An inline duplicate is how the three drift into installing differently.
      - name: Install Node dependencies
        run: make node-deps

      # Run the regression tier on its own, before the full gate. These tests
      # each reproduce a defect that already shipped once, so a failure here has
      # a specific meaning -- something came back -- that is worth reading
      # without scrolling through the whole suite. They also run again inside
      # `make ci`; the tier is fast enough that the duplicate is worth the
      # distinct signal.
      - name: Run regression/AQA tier (make test-regression)
        run: make test-regression

      - name: Run unified CI gate (make ci)
        # Same label-derived attestation as the matrix job; see the note there.
        env:
          ALLOW_GITHUB_CHANGES: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'infra-reviewed') && '1' || '' }}
        run: make ci

  # INV-1 (secret scan over working tree AND full history) had no live enforcement:
  # the gitleaks steps live in harness/{node,jvm}/.github/workflows/ci.yml, which are
  # adopter templates GitHub never runs — it only reads workflows from the repository
  # root. This job is the enforcement. It is separate from `build` because the scan is
  # interpreter-independent; running it inside the matrix would repeat identical work
  # four times.
  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: INV-1 requires scanning past commits, not just the tree.
          fetch-depth: 0

      # `make secrets-install` shells out to `go install`. GitHub's ubuntu image
      # happens to ship Go today, but relying on that makes INV-1 enforcement an
      # implicit dependency on the runner image: a base-image change would break
      # the scan rather than fail it loudly. Pin the toolchain explicitly.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install pinned gitleaks
        # Version is pinned in the Makefile so the local and CI gates cannot drift.
        run: make secrets-install

      - name: Run secret scan gate (make secrets)
        run: PATH="$(go env GOPATH)/bin:$PATH" make secrets
