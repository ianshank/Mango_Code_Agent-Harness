# Mango Code Agent Harness — unified CI pipeline.
# Runs the repo's own `make ci` gate (lint -> coverage -> test-node -> zero-skips
# -> validate -> drift-check) instead of a generic template.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    # `labeled` is load-bearing, not noise: ALLOW_GITHUB_CHANGES is derived from
    # the `infra-reviewed` label below, and the default types
    # [opened, synchronize, reopened] do not include it. Without this, applying
    # the label cannot re-run CI -- "Re-run all jobs" replays the original,
    # unlabelled event payload -- so a protected-path PR could only be unblocked
    # by pushing another commit or closing and reopening it.
    types: [opened, synchronize, reopened, labeled]
    # Stacked/phase branches must also be gated, otherwise a PR targeting an
    # integration branch merges without ever running `make ci`. `claude/**` is
    # the agent branch namespace and was missing here: a PR stacked onto one got
    # zero check runs, which is the exact hole this list exists to close.
    branches: ["main", "chore/**", "claude/**", "phase*/**", "feature/**"]

permissions:
  contents: read

jobs:
  # The Node suite's outcome is Python-version-independent, so the full gate
  # (make ci, including test-node + verify-zero-skips) runs on one primary leg
  # and the remaining interpreters run the Python-scoped `make ci-python`.
  # Previously every matrix leg installed pnpm/node_modules and ran the entire
  # Vitest suite — four identical Node runs per PR for one signal.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject ruff target-version is py39 (oldest supported).
        # check_py_compat gate enforces no runtime-only 3.10+ constructs.
        python-version: ["3.9", "3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps

      # Dependencies come from requirements-lock.txt, a universal lock whose
      # environment markers pip evaluates per interpreter: the 3.9 leg gets no
      # langgraph (it declares Requires-Python >=3.10) and every other leg does,
      # so the `langgraph`-marked suites run there instead of skipping. On 3.9
      # they are *deselected* -- visible in pytest's summary, never a skip --
      # through the conftest hook keyed to MANGO_CI_DESELECT_LANGGRAPH below,
      # and coverage_gate.py reads the same variable (via the policy's
      # coverage.optional_extras) to waive the per-file floor for the
      # langgraph modules on that leg only; aggregate floors still apply
      # (DEC-028). Pinned by test_workflow_contracts.py
      # (tech-debt-hardening-plan R-TDH-4, R-TDH-9).

      - name: Run Python CI gate (make ci-python)
        # The protected-path invariant fails closed on infrastructure changes
        # (Makefile, .github/**, .mango/agents/**, governance policy). A human
        # applying the `infra-reviewed` label IS the per-change review
        # attestation required by harness/CONTRACT.md; without the label the
        # gate stays fail-closed. Never set this unconditionally.
        env:
          ALLOW_GITHUB_CHANGES: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'infra-reviewed') && '1' || '' }}
          MANGO_CI_DESELECT_LANGGRAPH: ${{ matrix.python-version == '3.9' && '1' || '' }}
        run: make ci-python

  build-full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Primary leg: one modern interpreter runs the complete gate,
          # including the Node stack. The compat gate plus the ci-python matrix
          # covers the older interpreters.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps

      # pnpm must be on PATH *before* actions/setup-node runs, because
      # `cache: pnpm` resolves the pnpm store via the pnpm binary. Installing it
      # afterwards fails the "Set up Node" step with "Unable to locate
      # executable file: pnpm".
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          # Read the pinned version from `packageManager` in the Node package
          # manifest (single source of truth) rather than duplicating it here.
          package_json_file: harness/node/package.json

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # pnpm 11 (pinned via packageManager) requires Node >= 22.13.
          # Node 20 is also being deprecated on GitHub-hosted runners.
          node-version: 22
          cache: pnpm
          cache-dependency-path: harness/node/pnpm-lock.yaml

      # Routed through `make node-deps` rather than an inline pnpm call so CI,
      # the session-start hook and a local run all execute the same recipe.
      # An inline duplicate is how the three drift into installing differently.
      - name: Install Node dependencies
        run: make node-deps

      # Run the regression tier on its own, before the full gate. These tests
      # each reproduce a defect that already shipped once, so a failure here has
      # a specific meaning -- something came back -- that is worth reading
      # without scrolling through the whole suite. They also run again inside
      # `make ci`; the tier is fast enough that the duplicate is worth the
      # distinct signal.
      - name: Run regression/AQA tier (make test-regression)
        run: make test-regression

      - name: Run unified CI gate (make ci)
        # Same label-derived attestation as the matrix job; see the note there.
        env:
          ALLOW_GITHUB_CHANGES: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'infra-reviewed') && '1' || '' }}
        run: make ci

      # The `infra-reviewed` label attests to the table in the PR description, so
      # a table that does not list what the change actually touches makes the
      # attestation cover less than the label claims. That table was transcribed
      # by hand and drifted (DEC-038); this step compares it to the same set
      # `validate_invariants.py` enforces. Deliberately NOT gated on the label:
      # the reviewer must be able to read a verified table *before* deciding.
      # The body reaches the script through a file written from an env var, never
      # interpolated into the shell, so its content cannot become a command.
      - name: Verify the protected-path attestation table
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          make attestation-check FILE="$RUNNER_TEMP/pr-body.md"

  # INV-1 (secret scan over working tree AND full history) had no live enforcement:
  # the gitleaks steps live in harness/{node,jvm}/.github/workflows/ci.yml, which are
  # adopter templates GitHub never runs — it only reads workflows from the repository
  # root. This job is the enforcement. It is separate from `build` because the scan is
  # interpreter-independent; running it inside the matrix would repeat identical work
  # four times.
  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: INV-1 requires scanning past commits, not just the tree.
          fetch-depth: 0

      # `make secrets-install` shells out to `go install`. GitHub's ubuntu image
      # happens to ship Go today, but relying on that makes INV-1 enforcement an
      # implicit dependency on the runner image: a base-image change would break
      # the scan rather than fail it loudly. Pin the toolchain explicitly.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Install pinned gitleaks
        # Version is pinned in the Makefile so the local and CI gates cannot drift.
        run: make secrets-install

      - name: Run secret scan gate (make secrets)
        run: PATH="$(go env GOPATH)/bin:$PATH" make secrets

      # An allowlist path exempts its whole file from every rule, so an entry
      # that has stopped suppressing anything is a permanent blind spot. This
      # runs here, not in the unit suite: it needs gitleaks, the unit suite has
      # none, and INV-2 forbids adding a skip to paper over that.
      - name: Check the gitleaks allowlist still earns its entries
        run: PATH="$(go env GOPATH)/bin:$PATH" make secrets-allowlist-check

  # Closes the KNOWN_GAPS["audit"] exception in test_ci_gate_coverage.py: dependency
  # vulnerability scanning previously ran only in the per-stack adopter workflows,
  # which GitHub never executes (see the `secrets` job's comment, above). Separate
  # from `build`/`build-full` because, like `secrets`, it is interpreter-independent
  # -- running it on every Python matrix leg would repeat identical work.
  #
  # This leg also carries the Node delegation (osv-scanner), so it stays single-run
  # rather than joining the `audit-matrix` job below. `pip-audit` itself is pinned
  # via `make audit-install-python` (PIP_AUDIT_VERSION in the root Makefile) so this
  # gate cannot change or break on an unreviewed upstream release.
  audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pip-audit
        run: make audit-install-python

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Install pinned osv-scanner
        run: make -C harness/node audit-install

      - name: Run dependency audit gate (make audit)
        run: PATH="$(go env GOPATH)/bin:$PATH" make audit

  # `pip-audit` resolves dependency markers, `Requires-Python` and transitive
  # constraints under the interpreter that runs it. The `audit` job above only ever
  # resolves under 3.11, so a vulnerability that surfaces only under a transitive
  # dependency selected on 3.9, 3.10 or 3.12 would never be caught. Matrixed like
  # `build`; Python-only, since the Node delegation already runs once, in `audit`.
  #
  # The 3.9 leg is non-blocking (DEC-017): the patched releases of every vulnerable
  # package this leg has found (starlette, click, python-dotenv) require Python
  # >=3.10, so no version pin in requirements.txt can satisfy both "install under
  # 3.9" and "clean under 3.9" at once. Findings still surface -- fail-fast is off
  # and the step itself is not silenced -- this only stops them from blocking merge
  # on a gap this PR cannot close without dropping the 3.9 floor.
  audit-matrix:
    name: dependency-audit (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pip-audit
        run: make audit-install-python

      - name: Run dependency audit gate (make audit-python)
        # See DEC-017: every currently-available fix for a 3.9-resolved finding
        # requires Python >=3.10, so this leg cannot be made both 3.9-installable
        # and vulnerability-clean. Non-blocking here only; 3.10 and 3.12 stay
        # fully enforced.
        continue-on-error: ${{ matrix.python-version == '3.9' }}
        run: make audit-python
