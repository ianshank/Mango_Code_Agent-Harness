# Mango Code Agent Harness — unified CI pipeline.
# Runs the repo's own `make ci` gate (lint -> coverage -> test-node -> zero-skips
# -> validate -> drift-check) instead of a generic template.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Code uses PEP 604 unions (e.g. `str | None`) -> Python 3.10+.
        # pyproject ruff target-version is py311.
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: harness/node/pnpm-lock.yaml

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Run unified CI gate (make ci)
        run: make ci
