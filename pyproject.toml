[project]
name = "mango-code-agent-harness"
version = "2.1.9"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["harness/shared/tests", "harness/api_server/tests"]
markers = [
    "live: requires live NVIDIA_API_KEY credentials (deselect with -m 'not live')",
    "slow: tests that take > 5s",
    "security: security and secret sanitization tests",
    "governance: governance invariant validation",
    "neurosym: neuro-symbolic synthesis and repair loop invariants",
]
addopts = "--strict-markers -v --tb=short"

[tool.coverage.run]
# branch = true makes coverage.py record branch arcs. Note the knock-on effect:
# pytest-cov's report "total" becomes a blended statements+branches percentage,
# which is why the Makefile gate applies coverage.lines and coverage.branches as
# two separate numbers via coverage_gate.py instead of --cov-fail-under.
branch = true
source = ["harness/shared", "harness/api_server", "harness/control-plane"]
omit = [
    "harness/shared/tests/*",
    "harness/api_server/tests/*",
    "harness/shared/__pycache__/*",
    "harness/shared/install_hooks.sh",
    "harness/shared/pre_push_scan.sh",
    "harness/shared/pretooluse_guard.sh",
    "harness/shared/run_vitest.sh",
    "harness/shared/validate_specs.sh",
    # These two run argparse at module scope with required arguments and have no
    # `if __name__ == "__main__"` guard, so they cannot be imported in-process at all.
    # They read 0% as a measurement artifact, not as a quality signal, and would drag
    # the aggregate below the gate for a reason unrelated to test quality.
    # build_policy_bundle.py and regenerate_bundle_digests.py are deliberately NOT
    # omitted: both are __main__-guarded and loadable, so their gaps are real signal.
    "harness/control-plane/tool_broker_reference.py",
    "harness/control-plane/verify_repository.py"
]

[tool.coverage.report]
# No `fail_under` here on purpose. It previously hard-coded 80 while
# governance-policy.json declared 90, so any `pytest --cov` run that did not pass
# the Makefile's explicit flag silently enforced the weaker number. The threshold
# has one source: governance-policy.json -> coverage.lines, applied by the
# Makefile as --cov-fail-under=$(COV_MIN). Use `make coverage-python`.
show_missing = true

[tool.ruff]
target-version = "py39"   # oldest supported runtime; keep in sync with the CI matrix
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
# Governance validator scripts, control-plane tools, and per-stack re-export shims are
# intentionally compact CLI scripts; the shims must insert sys.path before importing.
per-file-ignores = { "harness/control-plane/*.py" = ["E501", "E701", "E702", "E401", "E711"], "harness/node/scripts/*.py" = ["E701", "E702", "E401", "E711", "E501", "E402"], "harness/jvm/scripts/*.py" = ["E701", "E702", "E401", "E711", "E501", "E402"], "harness/shared/check_*.py" = ["E701", "E702", "E401", "E711"], "harness/shared/validate_*.py" = ["E701", "E702", "E401", "E711"], "harness/shared/verify_*.py" = ["E401", "E402"], "harness/shared/remotes.py" = ["E402", "E501"], "harness/shared/pretooluse_guard.py" = ["E402", "E501"], "harness/api_server/tests/*.py" = ["E402", "I001"], "harness/shared/tests/*.py" = ["E501", "E701", "E702", "E402"], "scratch/*.py" = ["E501", "E701", "E702", "E402"] }

[tool.ruff.lint.isort]
known-first-party = ["harness"]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
