[project]
name = "mango-code-agent-harness"
version = "2.4.0"
requires-python = ">=3.9"
# Mirrors requirements.txt (single set of literals; keep both in lockstep).
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.13.5,<3.0",
    "httpx>=0.27,<1.0",
    "mcp>=2.0.0,<3.0; python_version >= '3.10'",
]

# The `langgraph` extra is the library alone, mirrored by requirements-langgraph.txt
# (single set of literals; keep both in lockstep) so CI can install and pip-audit
# exactly what the StateGraph tests import. The Postgres checkpointer is a separate
# extra: nothing in harness/ imports it, and folding it into `langgraph` would make
# every CI leg install psycopg that no gate ever scans (tech-debt-hardening-plan
# R-TDH-4).
[project.optional-dependencies]
langgraph = [
    "langgraph>=1.0.10,<2.0; python_version >= '3.10'",
]
langgraph-postgres = [
    "langgraph-checkpoint-postgres>=3.0.1,<4.0; python_version >= '3.10'",
]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["harness/shared/tests", "harness/api_server/tests"]
markers = [
    "live: requires live NVIDIA_API_KEY credentials (deselect with -m 'not live')",
    "slow: tests that take > 5s",
    "security: security and secret sanitization tests",
    "governance: governance invariant validation",
    "neurosym: neuro-symbolic synthesis and repair loop invariants",
    "langgraph: LangGraph orchestration graph tests",
]
# -m "not live": bare `pytest` used to collect the live suites and fail with
# "NVIDIA_API_KEY is not configured", so the documented entry point disagreed
# with `make test-python` (which passes -m "not live" explicitly). Select them
# with `pytest -m live`. Each live suite also carries its own skipif, so the
# two mechanisms are belt and braces rather than one point of failure.
# --disable-socket is the egress floor (R-EGF-1): an attempted connection
# raises instead of succeeding quietly. Tests that genuinely need a socket
# carry @pytest.mark.enable_socket at the test or class, so every exception is
# visible in the test rather than in this file (R-EGF-6).
addopts = "--strict-markers -v --tb=short -m 'not live' --disable-socket"

[tool.coverage.run]
# branch = true makes coverage.py record branch arcs. Note the knock-on effect:
# pytest-cov's report "total" becomes a blended statements+branches percentage,
# which is why the Makefile gate applies coverage.lines and coverage.branches as
# two separate numbers via coverage_gate.py instead of --cov-fail-under.
branch = true
source = ["harness/shared", "harness/api_server", "harness/control-plane"]
omit = [
    "harness/shared/tests/*",
    "harness/api_server/tests/*",
    "harness/shared/__pycache__/*",
    "harness/shared/install_hooks.sh",
    "harness/shared/pre_push_scan.sh",
    "harness/shared/pretooluse_guard.sh",
    "harness/shared/run_vitest.sh",
    "harness/shared/validate_specs.sh"
]

[tool.coverage.report]
# No `fail_under` here on purpose. It previously hard-coded 80 while
# governance-policy.json declared 90, so any `pytest --cov` run that did not pass
# the gate silently enforced the weaker number. The thresholds have one source:
# governance-policy.json -> coverage.{lines,branches,per_file}, applied by
# harness/shared/coverage_gate.py. Use `make coverage-python`.
show_missing = true

[tool.ruff]
target-version = "py39"   # oldest supported runtime; keep in sync with the CI matrix
line-length = 120

[tool.ruff.lint]
# Expansion is measured, never speculative: every rule below was run against
# the tree first, and every rule NOT selected is recorded in
# test_deferred_rigor.py with its finding count and the reason. See that file
# before adding or removing anything here.
#
# BLE is the load-bearing addition. The repository already carried 16
# `# noqa: BLE001` comments explaining why particular broad catches are
# deliberate fail-closed boundaries; with BLE unselected those comments were
# inert prose. Selecting it makes all 27 of them enforced decisions.
#
# RUF100 is safe *because* BLE is on: it flagged 20 inert noqa directives
# before, 13 of which were exactly those BLE001 justifications, so enabling it
# alone would have invited deleting them. With BLE selected the count drops to
# the 7 genuinely dead directives, which are removed in this change. RUF100 now
# protects the justifications instead of threatening them -- every noqa in the
# tree has to be load-bearing.
#
# B (bugbear) and G (logging format) arrive with the gate-hardening change.
# This line is the union of two independently reviewed sets, not a pick: the
# two changes were written in parallel against the same line, and dropping
# either half would silently retire rules that a reviewer had already approved.
#
# S (bandit) stays off deliberately: the subprocess-heavy gate scripts would
# need blanket waivers, which CLAUDE.md forbids without decision-log entries.
select = ["E", "F", "W", "I", "UP", "BLE", "RUF100", "ICN", "ISC", "RSE", "TID", "A", "C4",
          "PIE", "DTZ", "B", "G"]
# Control-plane tools are intentionally compact CLI scripts; the per-stack
# re-export shims must insert sys.path before importing (E402).
# Every entry below is pinned live by test_lint_config_liveness.py: each pattern
# must still match a file, and each code must still suppress a real finding.
# Ruff has no unused-ignore check, so without that test this block only ever
# grows -- three patterns (scratch/*.py for a directory that does not exist,
# and the check_*/validate_* globs) had already stopped suppressing anything.
[tool.ruff.lint.per-file-ignores]
"harness/jvm/scripts/*.py" = ["E402"]
"harness/node/scripts/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["harness"]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
