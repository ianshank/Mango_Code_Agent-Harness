title = "Agentic SSD Gitleaks Root Policy"

# Without this, --config REPLACES gitleaks' built-in ruleset rather than
# extending it, so a config that declares no [[rules]] detects nothing. The
# allowlist below then reads as a careful narrowing of a scan that was never
# running: a planted AKIA... key scanned clean under this config and was found
# immediately under the defaults. INV-1 depends on this line.
[extend]
useDefault = true

[allowlist]
description = "Strict allowlist: only explicitly reviewed non-secret fixture identifiers are permitted."
paths = [
  '''.*\.example.*''',
  '''harness/node/tests/ai/unit/nemotron-client\.test\.ts''',
  '''harness/node/tests/ai/security/secret-safety\.test\.ts''',
  '''harness/shared/tests/test_nemotron_bridge\.py''',
  '''harness/shared/tests/test_nemotron_bridge_live\.py''',
  '''harness/shared/tests/test_validate_invariants\.py''',
  '''harness/shared/tests/test_evidence_manifest\.py''',
  '''harness/shared/tests/test_governance_broker\.py''',
  '''harness/shared/tests/test_validation_scripts_extra\.py''',
  '''harness/shared/tests/test_debug_dump\.py''',
  '''harness/shared/tests/test_orchestrator_hooks\.py''',
  '''harness/shared/tests/test_tool_executors\.py''',
  '''harness/shared/tests/regression/test_orchestrator_dispatch_regression\.py''',
  '''harness/shared/tests/regression/test_cross_platform_regression\.py''',
  '''harness/shared/tests/regression/test_bridge_retry_regression\.py''',
  '''harness/shared/tests/regression/test_api_server_regression\.py''',
  '''harness/shared/tests/regression/test_e2e_nemotron_triage_regression\.py''',
  '''harness/shared/tests/regression/test_langgraph_regression\.py'''
]
