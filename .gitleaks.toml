title = "Agentic SSD Gitleaks Root Policy"

# Without this, --config REPLACES gitleaks' built-in ruleset rather than
# extending it, so a config that declares no [[rules]] detects nothing. The
# allowlist below then reads as a careful narrowing of a scan that was never
# running: a planted AKIA... key scanned clean under this config and was found
# immediately under the defaults. INV-1 depends on this line.
[extend]
useDefault = true

[allowlist]
# Strict allowlist: a path here exempts the WHOLE file from EVERY rule, so each
# entry must be earning that. Measured against the default ruleset with this
# block removed, the tree yields exactly 8 findings across 5 files; the list
# below is those 5 plus 2 deliberate entries named underneath. It previously
# carried 23 paths, 18 of which suppressed nothing while permanently blinding
# their files -- an allowlist describing itself as strict while being mostly
# blanket exemption. Re-add a path only when a scan actually flags it.
#
# The two entries with no current finding are kept on purpose, and declared
# below in the machine-readable form `make secrets-allowlist-check` reads
# (harness/shared/governance/check_secret_allowlist.py). That check scans the
# tree with this `paths` array emptied and fails any entry that suppresses
# nothing and is not declared here -- so an entry cannot quietly stop earning
# its place the way eighteen of the previous twenty-three did.
#
# keep: .*\.example.* -- adopter scaffolds (.env.example and peers) exist to carry placeholder credentials
# keep: harness/node/tests/ai/security/secret-safety\.test\.ts -- the designated leak-fixture module; it plants secret-shaped values to prove the masker redacts them
#
# NOT listed, and must not be: harness/node/tests/ai/unit/nemotron-policy-wiring.test.ts
# carries `nvapi-policy-wiring-test-key-1234567890` and produces zero findings
# even with this block removed -- it is below generic-api-key's entropy floor.
# The gate passes on it because the value does not look like a secret, not
# because it was exempted; listing it would blind that file to a real key.
description = "Strict allowlist: only fixture files with a measured, reviewed finding are permitted."
paths = [
  '''.*\.example.*''',
  '''harness/node/tests/ai/unit/nemotron-client\.test\.ts''',
  '''harness/node/tests/ai/security/secret-safety\.test\.ts''',
  '''harness/shared/tests/test_debug_dump\.py''',
  '''harness/shared/tests/test_governance_broker\.py''',
  '''harness/shared/tests/regression/test_e2e_nemotron_triage_regression\.py''',
  '''harness/shared/tests/regression/test_nemotron_api_aqa\.py'''
]
